services:
  app:
    build:
      context: .
      target: app
    env_file:
      - .env.production
    depends_on:
      - mysql
      - redis
    volumes:
      - civic_storage:/var/www/html/storage
    restart: unless-stopped

  worker:
    build:
      context: .
      target: app
    env_file:
      - .env.production
    command: ["supervisord", "-c", "/etc/supervisord.conf"]
    depends_on:
      - app
      - mysql
      - redis
    volumes:
      - civic_storage:/var/www/html/storage
    restart: unless-stopped

  nginx:
    build:
      context: .
      target: nginx
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - civic_storage:/var/www/html/storage:ro
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-civiclens}
      MYSQL_USER: ${MYSQL_USER:-civiclens}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  civic_storage:
  mysql_data:
  redis_data:
