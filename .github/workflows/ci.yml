name: CivicLens CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: civiclens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, dom, fileinfo, intl, mbstring, pdo_sqlite, redis, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Install native extraction toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-ben tesseract-ocr-eng
          pdftotext -v
          tesseract --version
          tesseract --list-langs | grep -qx ben

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Prepare writable Laravel directories
        run: |
          mkdir -p bootstrap/cache \
            storage/app/private \
            storage/app/public \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/testing \
            storage/framework/views \
            storage/logs
          chmod -R ug+rw bootstrap/cache storage

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan config:clear

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Validate production Compose configuration
        run: |
          cp .env.production.example .env.production
          trap 'rm -f .env.production' EXIT
          docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
          docker compose --env-file .env.production -f docker-compose.production.yml --profile release config --quiet

      - name: Run PHP tests
        run: composer test

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan and Larastan
        run: composer analyse

      - name: Run Rector dry-run
        run: composer refactor:dry

      - name: Run complexity metrics
        run: composer metrics

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Run Git whitespace check
        run: git diff --check

      - name: Cache Laravel optimized files
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
